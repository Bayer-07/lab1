name: CD - Entrega Contínua Docker

on:
  push:
    tags:
      - 'v*.*.*'   # só executa quando você criar uma tag como v1.0.0

jobs:
  publicar_imagem:
    name: Build e Push para Docker Hub
    runs-on: ubuntu-latest

    steps:
      - name: Clonar o Repositório
        uses: actions/checkout@v4

      # 1. Login usando as credenciais do cofre (Secrets)
      - name: Login no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 2. Constrói a imagem e envia ao Docker Hub com a mesma tag do Git
      - name: Build e Push da Imagem
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          # Exemplo: meuusuario/kanban-api:v1.0.0
          tags: ${{ secrets.DOCKER_USERNAME }}/kanban-api:${{ github.ref_name }}